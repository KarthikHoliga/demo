prompts:
  - |
    Write a customer service response to:

    {{inquiry}}

    Use these documents:

    {{context}}

providers:
  - openai:gpt-5-mini

tests:
  - vars:
      inquiry: "I haven't received my order after 10 days. What can I do?"
      context: "Orders usually arrive in 5-7 business days. If an order is delayed more than 10 days, customers can request a refund or a replacement through the Orders page or by contacting support@shop.com."
    assert:
      - type: icontains
        value: refund
      - type: llm-rubric
        value: Polite, and offers a refund or replacement using only options from the context